<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creepy Cookie Clicker</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Arial', sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: #add8e6; /* Stage 1 cheerful blue */
        transition: background 1s;
    }

    #game-container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        padding: 20px;
        text-align: center;
    }

    #cookie {
        width: 150px;
        height: 150px;
        background: url('assets/cookie_1.png') no-repeat center/cover;
        border-radius: 50%;
        cursor: pointer;
        transition: transform 0.1s;
    }

    #cookie:active {
        transform: scale(0.95);
    }

    #clicks {
        font-size: 24px;
        margin-top: 20px;
    }

    #dialogue, #choices, #tools {
        margin-top: 20px;
        display: none;
    }

    button.choice {
        display: block;
        margin: 8px auto;
        padding: 10px;
        font-size: 16px;
        cursor: pointer;
    }


    @media (min-width: 768px) {
        body {
            flex-direction: row;
        }
        #game-container {
            flex: 3;
        }

    }
</style>
</head>
<body>

<div id="game-container">
    <div id="cookie"></div>
    <div id="clicks">Clicks: 0</div>
    <div id="dialogue"></div>
    <div id="choices"></div>
    <div id="tools"></div>
</div>

<script>
// ====== COOKIE HELPERS ======
function setCookie(name, value, days) {
    let expires = "";
    if (days) {
        const date = new Date();
        date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
        expires = "; expires=" + date.toUTCString();
    }
    document.cookie = `${name}=${value || ""}${expires}; path=/`;
}

function getCookie(name) {
    const nameEQ = name + "=";
    const ca = document.cookie.split(';');
    for (let i = 0; i < ca.length; i++) {
        let c = ca[i];
        while (c.charAt(0) === ' ') c = c.substring(1, c.length);
        if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
    }
    return null;
}

// ====== GAME STATE ======
let clicks = 0;
let stage = 1;
let flags = {
    aggressiveClicker: false,
    calmPlayer: false,
    observant: false,
    desensitized: false,
    darkChoice1: false,
    neutralChoice: false,
    whimsy: false,
    reflectionClick: false,
    darkAcceptance: false,
    ritualUser: false,
    autoToolUse: false
};
let clickTimestamps = [];
let dialogueActive = false;

// ====== ELEMENTS ======
const cookieEl = document.getElementById('cookie');
const clicksEl = document.getElementById('clicks');
const dialogueEl = document.getElementById('dialogue');
const choicesEl = document.getElementById('choices');
const toolsEl = document.getElementById('tools');

// ====== STAGE THRESHOLDS ======
const thresholds = {
    1: 2**10,
    2: 2**12,
    3: 2**14,
    4: 2**16,
    5: 2**18,
    6: 2**20
};

// ====== LOAD SAVED STATE ======
const savedState = getCookie('gameState');
if (savedState) {
    try {
        const data = JSON.parse(savedState);
        clicks = data.clicks || 0;
        stage = data.stage || 1;
        flags = data.flags || flags;
    } catch (e) {
        console.error("Error parsing saved game data:", e);
    }
}

// Update UI with restored clicks and stage
clicksEl.textContent = `Clicks: ${clicks}`;
updateStage(); // Apply correct background and cookie image

// ====== CLICK LOGIC ======
cookieEl.addEventListener('click', () => {
    clicks++;
    clicksEl.textContent = `Clicks: ${clicks}`;
    trackAggression();

    checkStage();
    saveGame();
});

function trackAggression() {
    const now = Date.now();
    clickTimestamps.push(now);
    if (clickTimestamps.length > 10) clickTimestamps.shift();
    if (clickTimestamps.length >= 10) {
        const speed = clickTimestamps[9] - clickTimestamps[0];
        if (speed < 2000) flags.aggressiveClicker = true;
    }
}

// ====== STAGE PROGRESSION ======
function checkStage() {
    if (clicks >= thresholds[stage] && stage < 6) {
        stage++;
        updateStage();
    } else if (clicks >= thresholds[6]) {
        triggerEnding();
    }
}

function updateStage() {
    switch(stage) {
        case 1:
            document.body.style.background = '#add8e6';
            cookieEl.style.backgroundImage = "url('assets/cookie_1.png')";
            break;
        case 2:
            document.body.style.background = '#c0d6e4'; 
            cookieEl.style.backgroundImage = "url('assets/cookie_2.png')";
            break;
        case 3:
            document.body.style.background = '#b0c4de';
            cookieEl.style.backgroundImage = "url('assets/cookie_3.png')";
            if (!dialogueActive) triggerDialogueStage3();
            break;
        case 4:
            document.body.style.background = '#a9a9a9';
            cookieEl.style.backgroundImage = "url('assets/cookie_4.png')";
            break;
        case 5:
            document.body.style.background = '#5a1a1a';
            cookieEl.style.backgroundImage = "url('assets/cookie_5.png')";
            unlockTools();
            break;
    }
}

// ====== DIALOGUES ======
function triggerDialogueStage3() {
    dialogueActive = true;
    dialogueEl.style.display = 'block';
    dialogueEl.textContent = "What flavour is friendship?";
    choicesEl.style.display = 'block';
    choicesEl.innerHTML = `
        <button class="choice" data-choice="dark">The taste of my friends</button>
        <button class="choice" data-choice="neutral">The idea of my friend</button>
        <button class="choice" data-choice="whimsy">Idk, my little pony things man</button>
    `;
    document.querySelectorAll('.choice').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const choice = e.target.getAttribute('data-choice');
            if (choice === 'dark') flags.darkChoice1 = true;
            if (choice === 'neutral') flags.neutralChoice = true;
            if (choice === 'whimsy') flags.whimsy = true;
            dialogueEl.style.display = 'none';
            choicesEl.style.display = 'none';
            dialogueActive = false;
            saveGame();
        });
    });
}

// ====== TOOLS ======
function unlockTools() {
    toolsEl.style.display = 'block';
    toolsEl.innerHTML = `
        <button id="spatula">Spatula</button>
        <button id="mixer">Mixer</button>
        <button id="knife">Knife</button>
        <button id="wand">Magic Wand</button>
    `;
    document.getElementById('knife').addEventListener('click', () => {
        flags.ritualUser = true;
        alert('"It hurts..."');
        saveGame();
    });
    document.getElementById('wand').addEventListener('click', () => {
        flags.ritualUser = true;
        alert('"Wake up... please"');
        saveGame();
    });
}

// ====== SAVE GAME ======
function saveGame() {
    const gameState = {
        clicks: clicks,
        stage: stage,
        flags: flags
    };
    setCookie('gameState', JSON.stringify(gameState), 7);
}

// ====== ENDINGS ======
function triggerEnding() {
    let ending = "Void Loop";
    if (flags.darkChoice1 && flags.aggressiveClicker) ending = "The Feast";
    else if (flags.ritualUser) ending = "The Offering";
    else if (flags.neutralChoice && !flags.ritualUser) ending = "The Observer";
    else if (flags.reflectionClick) ending = "Reflection";
    else if (flags.whimsy && !flags.autoToolUse) ending = "The Escape";

    alert(`Ending Reached: ${ending}`);
    // Reset the game if needed
    document.cookie = "gameState=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
}
</script>

</body>
</html>
